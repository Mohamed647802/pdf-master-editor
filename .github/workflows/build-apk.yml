name: 🤖 Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Build Signed Release APK
        run: |
          sed -i 's/\r$//' android/build_apk.sh
          bash android/build_apk.sh

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFMaster-APK
          path: android/bin/PDFMaster.apk
          if-no-files-found: error
          retention-days: 90

      - name: 🚀 Publish Direct Download Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 android/bin/PDFMaster.apk --clobber
          else
            gh release create v2.0.0 android/bin/PDFMaster.apk \
              --title "PDF Master v2.0.0 (Android APK)" \
              --notes "Direct Android APK download — works 100% offline on Android!"
          fi
